name: Smartgram
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    name: Offline checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: ''
      OPENAI_ADMIN_KEY: ''
      GEMINI_API_KEY: ''
      DEEPGRAM_API_KEY: ''
      PEXELS_API_KEY: ''
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      SUBTITLE_FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      SMARTGRAM_FFMPEG_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install local test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fontconfig fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Scan the complete Git history
        run: |
          curl --fail --location --retry 2 -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=--all
          python server_infra/history_safety.py
      - name: Python regressions, external network blocked
        run: python server_infra/ci.py
      - name: Panel, progress and analytics regressions
        run: node --test server_infra/test_panel.mjs server_infra/test_progress.mjs web_analytics/test_costs.mjs
  deploy:
    name: Publish to Timeweb
    needs: checks
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: smartgram-production
      cancel-in-progress: false
    steps:
      - name: Publish the checked commit; wait for active video before restart
        env:
          DEPLOY_KEY: ${{ secrets.SMARTGRAM_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SMARTGRAM_KNOWN_HOSTS }}
          REVISION: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/smartgram_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/smartgram_ci -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 smartgram-dev@147.45.173.156 "publish $REVISION"
